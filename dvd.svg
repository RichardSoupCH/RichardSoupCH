<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="220" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2" />
  
  <g>
    <!-- Movimento Horizontal -->
    <animateTransform attributeName="transform" type="translate" values="10 0; 690 0; 10 0" dur="11s" repeatCount="indefinite" additive="sum" />
      
    <!-- Movimento Vertical -->
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 165; 0 10" dur="7s" repeatCount="indefinite" additive="sum" />

    <!-- Logo DVD com troca de cores -->
    <g>
      <animate attributeName="fill" values="#58A6FF;#FF7B72;#3FB950;#D2A8FF;#F2CC60;#58A6FF" dur="14s" repeatCount="indefinite" />
      
      <text x="50" y="26" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-style="italic" font-size="28" text-anchor="middle" letter-spacing="1">DVD</text>
      <ellipse cx="50" cy="34" rx="42" ry="6" />
      <ellipse cx="50" cy="34" rx="14" ry="2" fill="#0d1117" />
      <text x="50" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="7" text-anchor="middle" letter-spacing="4">VIDEO</text>
    </g>
  </g>
</svg>
